<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Space — Between Sundays</title>
<link rel="stylesheet" href="/ws.css"/></head><body>
<div class="wrap"><div id="body"></div></div>
<script src="/_nav.js"></script>
<script>
const KEYST="bts-agent-key";
const S={
 growth:{title:"Growth",kicker:"The space",
  sub:"How the paper finds the people who need it.",
  lede:"Nothing here is decided yet. The room exists so the questions have somewhere to live.",
  parts:[
   {h:"Go-to-market",q:["Who gets Issue 001 first, and how does it physically reach them?",
     "Churches, coffee shops, subscription, hand-to-hand — which one is the wedge?",
     "What has to be true for someone to pick it up without knowing us?"]},
   {h:"Platforms",q:["Where does an audience for a print paper actually get built?",
     "What does the paper look like as a post without becoming a post?"]},
   {h:"Personas",q:["Who is the reader who never liked reading? (That's the founder — start there.)",
     "Who buys it for someone else?","Who hands it out in bulk?"]},
   {h:"Messaging",q:["The one line that explains this to a stranger in six seconds.",
     "What we say about faith to someone who is suspicious of church."]},
   {h:"Creators & partners",q:["Who else makes something we'd be proud to sit next to?",
     "What does a contributor get out of appearing in it?"]}]},
 logistics:{title:"Logistics",kicker:"The space",
  sub:"What it takes to put paper in a hand.",
  lede:"The paper is 332 × 475 mm, 48 pages. Everything past that is unanswered.",
  parts:[
   {h:"Print",q:["Which printer, which stock, which press — and what's the minimum run?",
     "Colour throughout, or colour signatures only?","What's the lead time from final PDF to boxes?"]},
   {h:"Packaging",q:["How does it ship without arriving creased?",
     "Is there a wrap, a band, an insert? Does the removable Spine survive transit?"]},
   {h:"Unit costs",q:["Cost per copy at 500 / 2,000 / 10,000.",
     "Shipping per copy, and per box.","What does a returned or damaged copy cost us?"]},
   {h:"Margin",q:["Price per copy that a reader wouldn't blink at.",
     "The break-even run length.","Which costs fall away in Issue 002?"]}]},
 revenue:{title:"Revenue & Projections",kicker:"The space",
  sub:"What we charge, who pays, what the next year looks like.",
  lede:"No numbers have been set. When they are, they belong here and nowhere else.",
  parts:[
   {h:"Models",q:["Single copy, subscription, bulk/church orders, sponsorship — which combination?",
     "Does anything digital ever get sold, or is digital purely the front door?"]},
   {h:"Sponsorship",q:["The paper runs conceptual ads. Would a real sponsor break the voice?",
     "What would we refuse money for? (Decide before someone offers.)"]},
   {h:"Projections",q:["Twelve-month issue cadence and the copies behind each one.",
     "Cash needed before Issue 001 prints.","The number that means this works."]}]},
 products:{title:"Future Products",kicker:"The space",
  sub:"Everything after the paper.",
  lede:"A parking lot with a roof. Ideas kept here instead of dying in a chat log — nothing here is committed to.",
  parts:[
   {h:"Extensions of the paper",q:["The Spine as its own object.",
     "Issue archive / boxed set.","A children's or teen edition."]},
   {h:"Beyond print",q:["What does Between Sundays make that isn't a paper?",
     "Merch that isn't slogan-on-cotton."]},
   {h:"Parked ideas",q:["Anything anyone thought of and didn't want to lose."]}]}};
const id=new URLSearchParams(location.search).get("s")||"growth";
const s=S[id]||S.growth;
document.title=s.title+" — Between Sundays";
mount(id,{kicker:s.kicker,title:s.title,sub:s.sub});
const el=document.getElementById("body");
el.innerHTML=`<div class="slug">${s.title}</div><p class="lede">${s.lede}</p>`+
 s.parts.map(p=>`<div class="slug">${p.h}</div>
   <div class="blank"><div class="t">Open questions</div>
     <ol class="qs">${p.q.map(q=>`<li>${q}</li>`).join("")}</ol></div>`).join("")+
 `<hr class="rule"/><div id="notes"></div>`;
// Anything written to this space through the API appears below, newest last.
(async()=>{
 const k=(localStorage.getItem(KEYST)||"").trim();
 const n=document.getElementById("notes");
 if(!k){n.innerHTML=`<p style="font-size:13.5px;color:var(--gray)">Notes in this space are private.
   Open the <a href="/control-room.html">Control Room</a> and enter your key to read them.</p>`;return;}
 try{
  const r=await fetch("/api/state?path="+encodeURIComponent(`spaces/${id}.md`),{headers:{"x-agent-key":k}});
  const t=r.ok?(await r.text()).trim():"";
  n.innerHTML=t?`<div class="slug">Notes</div><div>${t.replace(/</g,"&lt;")
     .replace(/\n{2,}/g,"</p><p>").replace(/^/,"<p>")+"</p>"}</div>`
   :`<p style="font-size:13.5px;color:var(--gray)">No notes yet. Any agent can write this space with
     <code>POST /api/space {space:"${id}", text:"…"}</code> — it appears here without a deploy.</p>`;
 }catch{n.innerHTML="";}
})();
</script></body></html>
