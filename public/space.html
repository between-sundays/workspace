<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Space — Between Sundays HQ</title>
<link rel="stylesheet" href="/ws.css"/></head><body>
<div><div id="b"></div></div>
<script src="/_nav.js"></script>
<script>
const id=new URLSearchParams(location.search).get("s")||"";
const r=ROOMS.find(x=>x.id===id);
if(!r){location.href="/";}
const pil=PILLARS.find(p=>p.id===r.p);
mount(r.p,{title:r.label,sub:r.purpose});
document.getElementById("b").innerHTML=`
 <div class="slug">${pil.label} · ${r.label}</div>
 <div class="blank"><div class="t">This space has not been designed yet</div>
  <p>${r.purpose}</p></div>
 <div class="slug">Questions it should answer</div>
 <ol class="qs">${r.q.map(q=>`<li>${q}</li>`).join("")}</ol>
 <div class="slug">The record</div>
 <table class="tb"><tbody>
  <tr><th style="width:150px">Likely owner</th><td>${r.owner}</td></tr>
  <tr><th>Possible inputs</th><td>${r.inputs}</td></tr>
  <tr><th>Possible outputs</th><td>${r.outputs}</td></tr>
  <tr><th>Status</th><td>Empty by choice — no invented numbers, no placeholder dashboard.</td></tr>
 </tbody></table>
 <div class="slug">Thoughts</div>
 <div id="notes"></div>
 <div id="lockslot"></div>
 <div id="add" style="display:none;margin-top:14px">
  <textarea id="txt" rows="5" placeholder="Add the first thought. It appears here immediately — no deploy."
   style="width:100%;max-width:66ch;border:1px solid var(--rule);padding:10px;font:15px/1.55 var(--ser)"></textarea>
  <div><button id="go" style="border:1px solid var(--ink);background:var(--ink);color:#fff;
   padding:10px 20px;font-family:var(--san);font-size:11px;font-weight:800;letter-spacing:.12em;
   text-transform:uppercase;cursor:pointer">Add thought</button></div>
 </div>`;
document.getElementById("lockslot").innerHTML=lockbar(); wireLock();
const SPACEABLE=["growth","logistics","revenue","products"];
(async()=>{
 const n=document.getElementById("notes");
 if(!getKey()){n.innerHTML='<p style="color:var(--gray)">Locked.</p>';return;}
 const key=SPACEABLE.includes(id)?id:null;
 if(!key){n.innerHTML=`<p style="color:var(--gray)">This room doesn't take written notes yet —
   drop thoughts in the <a href="/inbox.html">Inbox</a> tagged for ${r.label} and they'll be
   sorted here.</p>`;return;}
 const t=await state(`spaces/${key}.md`);
 n.innerHTML=t?`<div>${("<p>"+t.replace(/</g,"&lt;").trim().replace(/\n{2,}/g,"</p><p>")+"</p>")}</div>`
  :'<p style="color:var(--gray)">Nothing written here yet.</p>';
 const add=document.getElementById("add"); add.style.display="block";
 document.getElementById("go").onclick=async()=>{
  const v=document.getElementById("txt").value.trim();
  if(v.length<20){alert("Write a little more than that.");return;}
  await api("space",{space:key,text:(t?t+"\n\n":"")+v}); location.reload();};
})();
</script></body></html>
