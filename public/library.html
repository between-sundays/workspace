<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<meta property="og:site_name" content="Between Sundays HQ"/>

<meta property="og:description" content="Good news. Printed. The workspace where Between Sundays Issue 001 gets made."/>

<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>

<link rel="stylesheet" href="/ws.css"/>
<style>
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rf{background:var(--surface);border-radius:var(--r);overflow:hidden;cursor:zoom-in;
 border:1px solid transparent;transition:.12s}
.rf:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,25,40,.09)}
.rf img{width:100%;display:block;background:#f2f4f8;aspect-ratio:3/4;object-fit:cover;
 object-position:top center}
.rf .m{padding:13px 15px 15px}
.rf .m b{display:block;font-size:14.5px;font-weight:750;letter-spacing:-.01em;line-height:1.25}
.rf .m .k{font-size:11px;font-weight:750;color:var(--mute);margin-top:5px;display:block}
.rf.untagged{opacity:.72}
.rf.untagged .m b{color:var(--mute);font-weight:600}
#lb{position:fixed;inset:0;z-index:70;background:rgba(15,18,25,.93);display:none;padding:22px;
 overflow:auto}
#lb.on{display:block}
#lb .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:22px;
 align-items:start}
#lb img{width:100%;border-radius:12px;background:#fff}
#lb .side{background:#fff;border-radius:var(--r);padding:22px 24px;position:sticky;top:22px}
#lb h3{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.02em}
#lb .k{font-size:11.5px;font-weight:750;color:var(--mute)}
#lb .x{position:fixed;top:18px;right:22px;background:#fff;border:0;border-radius:999px;
 width:38px;height:38px;font-size:19px;cursor:pointer;z-index:71}
@media(max-width:900px){#lb .in{grid-template-columns:1fr}}
</style></head><body>
<p class="lede">Every reference we design against, kept for good. When we build a page we say which
reference it's answering — that's how a look becomes a system instead of a mood.</p>
<div class="chips" id="filters" style="margin:14px 0"></div>
<p id="count" style="color:var(--mute);font-size:13.5px"></p>
<div class="refs" id="grid"></div>
<div id="lb"><button class="x" onclick="document.getElementById('lb').classList.remove('on')">×</button>
 <div class="in"><img id="lbi" alt=""/><div class="side" id="lbs"></div></div></div>
<script src="/_nav.js"></script>
<script>
mount("build",{title:"Reference Library",sub:"What good looks like, and exactly what to take from each one."});
const KINDS=[["all","Everything"],["cover","Covers"],["spread","Spreads"],["feature","Features"],
 ["listing","Listings"],["explainer","Explainers"],["sports","Sports"],["system","Systems"],
 ["untagged","Not yet studied"]];
let R=[],k="all";
function draw(){
 const rows=k==="all"?R:R.filter(x=>x.k===k);
 document.getElementById("count").textContent=
  `${rows.length} of ${R.length} · ${R.filter(x=>x.k!=="untagged").length} studied in detail`;
 document.getElementById("grid").innerHTML=rows.map((x,i)=>
  `<div class="rf ${x.k==="untagged"?"untagged":""}" data-i="${R.indexOf(x)}">
   <img loading="lazy" src="/refs/${x.f}" alt=""/>
   <div class="m"><b>${x.t}</b><span class="k">${x.k==="untagged"?"not yet studied":x.k}</span></div></div>`).join("");
 document.querySelectorAll(".rf").forEach(el=>el.onclick=()=>openRef(R[+el.dataset.i]));
}
function openRef(x){
 document.getElementById("lbi").src="/refs/"+x.f;
 document.getElementById("lbs").innerHTML=`<h3>${x.t}</h3><span class="k">${x.k}</span>
  ${x.lesson?`<p style="margin-top:12px">${x.lesson}</p>`:
   `<p style="margin-top:12px;color:var(--mute)">Nobody has studied this one yet. Open it, look hard, and write down what it does that our pages do not.</p>`}
  ${(x.steal||[]).length?`<div class="slug" style="margin-top:16px">What to take</div>
   <ul class="sigs">${x.steal.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}`;
 document.getElementById("lb").classList.add("on");
}
document.getElementById("filters").innerHTML=KINDS.map(([id,l])=>
 `<button class="chip ${id==="all"?"on":""}" data-k="${id}">${l}</button>`).join("");
document.querySelectorAll("#filters .chip").forEach(b=>b.onclick=()=>{
 k=b.dataset.k;
 document.querySelectorAll("#filters .chip").forEach(x=>x.classList.toggle("on",x===b));
 draw();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb").classList.remove("on");});
fetch("/data/refs.json").then(r=>r.json()).then(d=>{R=d;draw();});
</script></body></html>
