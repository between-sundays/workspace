<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Persona — Between Sundays HQ</title>
<link rel="stylesheet" href="/ws.css"/></head><body>
<div class="wrap"><div id="b"></div></div>
<script src="/_nav.js"></script>
<script>
const ID=(new URLSearchParams(location.search).get("id")||"").trim();
(async()=>{
 const raw=(await state("personas.jsonl"))||[];
 const P={};raw.forEach(x=>P[x.id]=x); const p=P[ID];
 mount("grow",{kicker:"Grow · persona group",title:p?p.name:"Persona",
  sub:p?(p.size||""):"Not found"});
 const b=document.getElementById("b");
 if(!getKey()){b.innerHTML=lockbar();wireLock();return;}
 if(!p){b.innerHTML='<p style="color:var(--gray)">No such group. <a href="/atlas.html">Back to the Atlas</a>.</p>';return;}
 const [pros,out,msgs]=await Promise.all([state("prospects.jsonl"),state("outreach.jsonl"),
   state("messages.jsonl")]);
 const mine=(pros||[]).filter(x=>(x.personas||[x.persona]).includes(ID));
 const latest={}; mine.forEach(x=>latest[x.handle]=x);
 const S=["discovered","learning","worth-knowing","engaging","conversation","invited","ongoing"];
 const cnt={}; S.forEach(s=>cnt[s]=Object.values(latest).filter(x=>x.stage===s).length);
 const lab=(msgs||[]).filter(m=>m.persona===ID);
 const sent=(out||[]).filter(o=>o.persona===ID);
 b.innerHTML=`
  <div class="phead">
   <div class="port" style="color:${p.ink};border-color:${p.ink}">${p.face||"·"}</div>
   <div><span class="hyp ${p.evidence==="supported"?"sup":""}">${(p.evidence||"hypothesis").replace("-"," ")}</span>
    <p style="margin:8px 0 0;font-size:13px;color:var(--gray);max-width:64ch">
     ${p.evidenceNote||"No real conversations yet — this whole card is a bet, not a finding."}</p></div></div>
  <div class="slug" style="color:${p.ink}">The world</div>
  <p class="lede">${p.who}</p>
  <div class="slug">The moment they're in</div>
  <ul class="sigs">${(p.moments||[]).map(m=>`<li>${m}</li>`).join("")}</ul>
  <div class="slug">The signals — public, observable, never inferred</div>
  <ul class="sigs">${(p.signals||[]).map(s=>`<li>${s}</li>`).join("")}</ul>
  <div class="slug">Where they are</div>
  <ul class="sigs">${(p.where||[]).map(s=>`<li>${s}</li>`).join("")}</ul>
  <div class="slug">Search recipes</div>
  <p style="font-size:13.5px;color:var(--gray)">Hand these to an agent or run them yourself. Permitted
   search and human reading only — no scrapers, no automation against a platform's terms.</p>
  ${(p.recipes||[]).map(r=>`<div class="recipe">${r.replace(/</g,"&lt;")}</div>`).join("")}
  <div class="two">
   <div><div class="slug">Words they use</div>
    <div class="words">${(p.theirWords||[]).map(w=>`<span class="wd">${w}</span>`).join("")}</div></div>
   <div><div class="slug">Words we avoid</div>
    <div class="words">${(p.avoidWords||[]).map(w=>`<span class="wd no">${w}</span>`).join("")}</div></div>
  </div>
  <div class="two">
   <div><div class="slug">What makes them notice us</div><p>${p.notice||""}</p></div>
   <div><div class="slug">What makes them distrust us</div><p>${p.distrust||""}</p></div>
  </div>
  <div class="slug">The angle</div><p>${p.angle}</p>
  <div class="slug">The first ask — zero friction</div><p>${p.ask}</p>
  <div class="slug">What they'll push back with</div><p>${p.objection}</p>
  <div class="slug">What they already read, watch and listen to</div>
  <ul class="sigs">${(p.reads||[]).map(s=>`<li>${s}</li>`).join("")}</ul>
  <div class="slug">What we could offer them</div>
  <ul class="sigs">${(p.offers||[]).map(s=>`<li>${s}</li>`).join("")}</ul>
  <div class="slug">The Bible bridge</div>
  <div class="refs">${(p.refs||[]).map(r=>`<span class="ref">${r}</span>`).join("")}</div>
  <p style="font-size:13px;color:var(--gray);margin-top:8px">References only — verse text is always
   fetched, never quoted from memory.</p>
  <div class="slug">The portrait</div>
  <div class="blank"><div class="t">Waiting on Adrian</div>
   <p>Illustrated portrait, not a stock photo — and not generated. Adrian makes the art; the system
    is the press. Drop the file in and it goes here.</p></div>
  <div class="slug">Where this group stands</div>
  <div class="pipe" style="grid-template-columns:repeat(7,1fr)">${S.map(s=>
    `<div><b>${cnt[s]}</b><span>${s.replace("-"," ")}</span></div>`).join("")}</div>
  <p style="font-size:13.5px">${Object.keys(latest).length} people ·
   ${sent.length} conversations recorded ·
   ${lab.length} message experiment${lab.length===1?"":"s"} ·
   <a href="/desk.html?persona=${ID}">open the desk</a> ·
   <a href="/message-lab.html?persona=${ID}">open the lab</a></p>
  <div class="slug">The people in this group</div>
  <p style="font-size:13.5px;color:var(--gray)">Real, named, publicly findable — each with the link
   and the reason they fit. This is the list we actually work.</p>
  <div id="ppl"></div>
  <div class="drop" style="margin-top:14px">
   <input id="handle" placeholder="Name or @handle"/>
   <input id="url" placeholder="Link to their public profile or the post that flagged them"/>
   <input id="role" placeholder="What they do / where they are (only if publicly shared)"/>
   <input id="reach" placeholder="Audience size range — e.g. ~1.2k"/>
   <textarea id="signal" rows="3" placeholder="Why they fit this group — quote the public thing they posted."></textarea>
   <input id="next" placeholder="Next step"/>
   <button id="add" style="border:1px solid var(--ink);background:var(--ink);color:#fff;
    padding:11px 22px;font-family:var(--san);font-size:11px;font-weight:800;letter-spacing:.13em;
    text-transform:uppercase;cursor:pointer">Add this person</button>
  </div>
  <div class="slug">Open questions</div>
  <div class="blank"><div class="t">What we still don't know</div>
   <ol class="qs">${(p.open||[]).map(q=>`<li>${q}</li>`).join("")}</ol></div>`;
 const L=Object.values(latest);
 document.getElementById("ppl").innerHTML=L.length?
  `<table class="tb"><thead><tr><th style="width:150px">Who</th><th>Why they fit</th>
   <th style="width:96px">Reach</th><th style="width:118px">Stage</th><th style="width:150px">Next</th>
   </tr></thead><tbody>${L.reverse().map(x=>
   `<tr><td>${x.url?`<a href="${x.url}" target="_blank" rel="noopener noreferrer nofollow">${x.handle}</a>`:x.handle}
     ${x.role?`<div style="font-size:11.5px;color:var(--gray)">${x.role}</div>`:""}</td>
    <td>${(x.signal||"").replace(/</g,"&lt;")}</td>
    <td>${x.reach||"—"}</td>
    <td><span class="pill ${["ongoing","reader","creator","partner"].includes(x.stage)?"on":(x.stage==="do-not-contact"?"no":"")}">${(x.stage||"").replace(/-/g," ")}</span></td>
    <td style="font-size:12.5px">${x.next||""}</td></tr>`).join("")}</tbody></table>`
  :'<p style="color:var(--gray)">Nobody in this group yet. Add the first real person — or ask an agent to go find them.</p>';
 document.getElementById("add").onclick=async()=>{
  const h=document.getElementById("handle").value.trim();
  const sg=document.getElementById("signal").value.trim();
  if(h.length<2){alert("Who is it?");return;}
  if(sg.length<10){alert("Say why they fit — quote the public thing they posted. That's the whole row.");return;}
  await api("prospect",{handle:h,persona:ID,url:document.getElementById("url").value.trim(),
   role:document.getElementById("role").value.trim(),reach:document.getElementById("reach").value.trim(),
   signal:sg,next:document.getElementById("next").value.trim(),stage:"discovered"});
  location.reload();};
})();
</script></body></html>
