<div><div id="b"></div></div>
<script src="/_nav.js"></script>
<script>
const P="grow"; const pil=PILLARS.find(x=>x.id===P);
mount(P,{title:pil.label,sub:pil.blurb});
const rooms=ROOMS.filter(r=>r.p===P);
document.getElementById("b").innerHTML=
 '<div class="slug">'+pil.label+'</div>'+
 '<p class="lede">Rooms that are built are linked. Rooms not yet designed still exist \u2014 they '+
 'carry the questions they are there to answer, and anyone can add the first thought.</p>'+
 '<div class="cards">'+rooms.map(function(r,i){
  var n=String(i+1).padStart(2,"0");
  return r.live
   ? '<a class="card" href="'+r.href+'"><span class="num">'+n+'</span><h3>'+r.label+'</h3><p>'+r.d+
     '</p><span class="st live">Built</span></a>'
   : '<a class="card" href="/space.html?s='+r.id+'"><span class="num">'+n+'</span><h3>'+r.label+
     '</h3><p>'+r.purpose+'</p><span class="st empty">Not designed yet</span></a>';
 }).join("")+'</div>';
</script></body></html>
